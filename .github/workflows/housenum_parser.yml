name: housenumparser backend tests

on:
  pull_request:
    paths:
      - housenumparser/**
      - tests/**
      - .github/workflows/housenum_parser.yml
      - pyproject.toml
      - requirements*.txt

  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-tests.yml@v1
    permissions:
      contents: read
      pull-requests: write # coverage comment
    with:
      runs-on: ubuntu-latest # public repo: no self-hosted runners
      python-versions: '["3.10", "3.11", "3.12"]'
      requirements-file: requirements-dev.txt
      lint-command: "" # the old workflow ran no linter
      test-command: pytest tests --cov=housenumparser --cov-report=xml:"$COVERAGE_XML" --capture=no -vvv
      coverage-threshold-new: 0 # the old workflow didn't set it
